<!DOCTYPE html>
<html>
<head>
<title>打赏给作者😋</title>
<style>
    summary{
        font-size: 1.2rem;
        color: #cf4141;
    }
    details{
        font-size: 1rem;
        color: #000000;
    }
    code{
        background-color: #cacaca;
        border-radius: 10px;
    }

    .text-container {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        /* 定义遮罩层的样式 */
        .text-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(73, 73, 73); /* 遮罩颜色 */
            z-index: 1; /* 确保遮罩层在文本上方 */
        }

        /* 当鼠标悬停时，隐藏遮罩层 */
        .text-container:hover::before {
            display: none;
        }
</style>
</head>
<body>
<h1>打赏给作者😋</h1>
<img src="_tip.png" alt="tipimage">
</body>
</html>
