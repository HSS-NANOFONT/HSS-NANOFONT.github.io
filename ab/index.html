    summary{

    code{
        background-color: #cacaca;

    .text-container {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        /* 定义遮罩层的样式 */
        .text-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(73, 73, 73); /* 遮罩颜色 */
            z-index: 1; /* 确保遮罩层在文本上方 */
        }

        /* 当鼠标悬停时，隐藏遮罩层 */
        .text-container:hover::before {
            display: none;
        }
</style>
